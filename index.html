<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>meri | For every way we celebrate</title>
  <meta name="description" content="For every way we celebrate. Coming soon.">
  <meta name="theme-color" content="#07133e">
  <meta property="og:title" content="meri | For every way we celebrate">
  <meta property="og:description" content="For every way we celebrate. Coming soon.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://meri.events/">
  <meta property="og:image" content="https://meri.events/meri-hero-desktop.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/meri-logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #07133e;
      --blue-deep: #030820;
      --pink: #ea1e64;
      --coral: #f05b52;
      --parchment: #f4eadb;
      --white: #fffaf2;
      --line: rgba(255, 250, 242, 0.4);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }

    html,
    body { min-height: 100%; }

    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--white);
      background: var(--blue-deep);
      font-family: "DM Sans", sans-serif;
      font-weight: 500;
    }

    .landing {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100dvh;
      overflow: hidden;
      padding: clamp(24px, 3vw, 46px);
      background: var(--blue-deep);
    }

    .hero-media,
    .hero-grade,
    .hero-grain {
      position: absolute;
      z-index: -3;
      inset: 0;
      pointer-events: none;
    }

    .hero-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: var(--blue-deep);
      animation: settle 1700ms var(--ease) both;
    }

    .hero-grade {
      z-index: -2;
      background:
        linear-gradient(90deg, rgba(3, 8, 32, 0.82) 0%, rgba(3, 8, 32, 0.2) 44%, rgba(3, 8, 32, 0.04) 72%),
        linear-gradient(180deg, rgba(3, 8, 32, 0.28), transparent 36%, rgba(3, 8, 32, 0.82));
    }

    .hero-grain {
      z-index: -1;
      opacity: 0.09;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
    }

    .topline,
    .bottomline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .topline {
      align-items: flex-start;
      animation: arrive 800ms 120ms var(--ease) both;
    }

    .brand {
      width: clamp(104px, 10vw, 164px);
      height: auto;
      filter: brightness(0) invert(1);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 5px 0 0;
      font-size: 0.66rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      content: "";
      background: var(--pink);
      box-shadow: 0 0 0 5px rgba(234, 30, 100, 0.18);
    }

    .statement {
      align-self: end;
      width: min(760px, 70vw);
      padding-bottom: clamp(28px, 7vh, 82px);
    }

    h1 {
      margin: 0;
      font-size: clamp(3.4rem, 7.25vw, 7.6rem);
      font-weight: 400;
      letter-spacing: -0.07em;
      line-height: 0.87;
      text-wrap: balance;
      animation: arrive 980ms 230ms var(--ease) both;
    }

    .celebrate-word {
      display: block;
      width: max-content;
      max-width: 100%;
      overflow: hidden;
      color: var(--pink);
      font-weight: 700;
      text-shadow: 0 2px 28px rgba(3, 8, 32, 0.28);
      animation: colour-reveal 1050ms 720ms var(--ease) both;
    }

    .bottomline {
      padding-top: 20px;
      border-top: 1px solid var(--line);
      animation: arrive 880ms 370ms var(--ease) both;
    }

    .edition-note {
      margin: 0;
      color: rgba(255, 250, 242, 0.72);
      font-size: 0.69rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .instagram-link {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      min-height: 44px;
      padding: 0;
      color: var(--white);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .instagram-link::after {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 250, 242, 0.75);
      border-radius: 50%;
      content: "↗";
      font-size: 1rem;
      transition: color 520ms var(--ease), background 520ms var(--ease), transform 520ms var(--ease);
    }

    .instagram-link:hover::after {
      color: var(--blue);
      background: var(--white);
      transform: rotate(45deg);
    }

    .instagram-link:focus-visible {
      outline: 2px solid var(--white);
      outline-offset: 5px;
    }

    @media (max-width: 780px) {
      .landing { padding: 20px; }

      .hero-grade {
        background:
          linear-gradient(180deg, rgba(3, 8, 32, 0.46), transparent 30%, rgba(3, 8, 32, 0.87) 82%),
          linear-gradient(90deg, rgba(3, 8, 32, 0.48), rgba(3, 8, 32, 0.04));
      }

      .statement {
        width: 100%;
        padding-bottom: 42px;
      }

      h1 { font-size: clamp(3.4rem, 17vw, 6rem); }

      .bottomline {
        align-items: flex-end;
      }

    }

    @media (max-width: 440px) {
      .edition-note { display: none; }
      .bottomline { justify-content: flex-end; }
      .instagram-link { gap: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @keyframes settle {
      from { opacity: 0; transform: scale(1.08); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(28px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes colour-reveal {
      from { clip-path: inset(0 100% 0 0); }
      to { clip-path: inset(0 0 0 0); }
    }
  </style>
</head>
<body>
  <main class="landing">
    <video class="hero-media" poster="/meri-hero-desktop.jpg" autoplay muted loop playsinline
           preload="metadata" disablepictureinpicture aria-hidden="true"></video>
    <div class="hero-grade" aria-hidden="true"></div>
    <div class="hero-grain" aria-hidden="true"></div>

    <header class="topline">
      <img class="brand" src="/meri-logo.svg" alt="meri">
      <p class="status">Coming soon</p>
    </header>

    <section class="statement" aria-labelledby="page-title">
      <h1 id="page-title">For every way we <span class="celebrate-word">celebrate.</span></h1>
    </section>

    <footer class="bottomline">
      <p class="edition-note">meri.events</p>
      <a class="instagram-link" href="https://www.instagram.com/themerievents/" target="_blank" rel="noopener noreferrer">Follow @themerievents</a>
    </footer>
  </main>

  <script>
    // Serve the 16:9 cut to wide viewports and the 9:16 cut to phones, fetching only the
    // one that will actually be seen. If the visitor has asked for reduced motion, or the
    // browser refuses to autoplay, the poster frame stands in.
    (function () {
      var video = document.querySelector('.hero-media');
      if (!video) return;

      var calm = window.matchMedia('(prefers-reduced-motion: reduce)');
      var small = window.matchMedia('(max-width: 780px)');
      var current = '';

      function nudge() {
        if (calm.matches) return;
        var attempt = video.play();
        if (attempt && attempt.catch) attempt.catch(function () {});
      }

      function apply() {
        var variant = small.matches ? 'mobile' : 'desktop';
        var state = variant + (calm.matches ? ':still' : ':motion');
        if (state === current) { nudge(); return; }
        current = state;

        video.poster = '/meri-hero-' + variant + '.jpg';

        if (calm.matches) {
          video.removeAttribute('src');
          video.load();
          return;
        }

        video.setAttribute('src', '/meri-hero-' + variant + '.mp4');
        video.load();
        nudge();
      }

      apply();

      // matchMedia change alone is not dependable across browsers, so watch resize too.
      var timer;
      window.addEventListener('resize', function () {
        clearTimeout(timer);
        timer = setTimeout(apply, 150);
      });
      [small, calm].forEach(function (mq) {
        if (mq.addEventListener) mq.addEventListener('change', apply);
        else if (mq.addListener) mq.addListener(apply);
      });

      // Autoplay can be deferred or suspended; pick it back up when we can.
      video.addEventListener('canplay', nudge);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) nudge();
      });
    })();
  </script>
</body>
</html>
