<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Come in early | meri</title>
  <meta name="description" content="Join the meri waitlist.">
  <meta name="theme-color" content="#030820">
  <link rel="icon" href="/meri-logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color: #fffaf2;
      background: #030820;
      font-family: "DM Sans", sans-serif;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      background: #030820 url('/meri-hero-desktop.jpg') center / cover fixed;
    }

    .hero-media,
    .hero-grade,
    .hero-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .hero-media {
      z-index: -3;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .hero-grade {
      z-index: -2;
      background:
        linear-gradient(90deg, rgba(3, 8, 32, 0.88), rgba(3, 8, 32, 0.48) 58%, rgba(3, 8, 32, 0.28)),
        linear-gradient(180deg, rgba(3, 8, 32, 0.28), rgba(3, 8, 32, 0.78));
    }

    .hero-grain {
      z-index: -1;
      opacity: 0.08;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
    }

    main {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100svh;
      width: min(680px, calc(100% - 40px));
      margin: 0 auto;
      padding: 32px 0 28px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: block;
      width: 112px;
      filter: brightness(0) invert(1);
    }

    .close {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      border: 1px solid rgba(255, 250, 242, 0.72);
      border-radius: 50%;
      color: #fffaf2;
      font-size: 1.8rem;
      line-height: 1;
      text-decoration: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 11vw, 7rem);
      font-weight: 600;
      letter-spacing: -0.075em;
      line-height: 0.9;
      text-wrap: balance;
    }

    .intro {
      max-width: 560px;
      margin: 24px 0 48px;
      color: rgba(255, 250, 242, 0.78);
      font-size: clamp(1rem, 2.5vw, 1.22rem);
      line-height: 1.5;
    }

    #form-state,
    .success { align-self: center; padding: 72px 0; }

    .form { display: grid; gap: 26px; }

    .bot-field { position: absolute; left: -9999px; }

    .field { display: grid; gap: 10px; }

    label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      border: 0;
      border-bottom: 1px solid rgba(255, 250, 242, 0.42);
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: #fffaf2;
      font: inherit;
      font-size: 1.12rem;
      padding: 13px 0 15px;
    }

    input:focus { border-bottom-color: #fffaf2; }

    button {
      display: flex;
      width: 100%;
      min-height: 76px;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding: 0 30px;
      border: 0;
      border-radius: 999px;
      background: #ed1e64;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    button:disabled { cursor: wait; opacity: 0.7; }

    button:focus-visible,
    .close:focus-visible,
    a:focus-visible {
      outline: 3px solid #fffaf2;
      outline-offset: 4px;
    }

    .note,
    .error {
      margin: -8px 0 0;
      color: rgba(255, 250, 242, 0.68);
      font-size: 0.78rem;
      line-height: 1.5;
    }

    a { color: inherit; text-underline-offset: 3px; }
    .error { color: #ff9aba; }

    .success .kicker {
      margin: 0 0 22px;
      color: #ed1e64;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .success h2 {
      margin: 0;
      font-size: clamp(4rem, 14vw, 8rem);
      font-weight: 500;
      letter-spacing: -0.075em;
      line-height: 0.82;
    }

    .success p:last-child {
      max-width: 480px;
      margin-top: 32px;
      color: rgba(255, 250, 242, 0.76);
      font-size: 1.04rem;
      line-height: 1.55;
    }

    [hidden] { display: none !important; }

    @media (max-width: 520px) {
      main { width: min(100% - 32px, 680px); padding-top: 22px; }
      .logo { width: 96px; }
      .close { width: 46px; height: 46px; }
      .intro { margin-bottom: 44px; }
      button { min-height: 68px; padding: 0 24px; }
      body { background-image: url('/meri-hero-mobile.jpg'); }
      #form-state,
      .success { padding: 56px 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-media { display: none; }
    }
  </style>
</head>
<body>
  <video class="hero-media" poster="/meri-hero-desktop.jpg" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-hidden="true">
    <source src="/meri-hero-mobile.mp4" type="video/mp4" media="(max-width: 780px)">
    <source src="/meri-hero-desktop.mp4" type="video/mp4">
  </video>
  <div class="hero-grade" aria-hidden="true"></div>
  <div class="hero-grain" aria-hidden="true"></div>

  <main>
    <header>
      <img class="logo" src="/meri-logo.svg" alt="meri">
      <a class="close" href="/" aria-label="Return to meri">×</a>
    </header>

    <section id="form-state">
      <h1>Come in early.</h1>
      <p class="intro">Join our waitlist.</p>

      <form class="form" id="waitlist-form" name="meri-early-access" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="meri-early-access">
        <p class="bot-field">
          <label>Don’t fill this out if you’re human: <input name="bot-field"></label>
        </p>

        <div class="field">
          <label for="full-name">Full name</label>
          <input id="full-name" name="full-name" type="text" autocomplete="name" required autofocus>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" required>
        </div>

        <button type="submit"><span>Request early access</span><span aria-hidden="true">→</span></button>
        <p class="note">Follow <a href="https://www.instagram.com/themerievents/" target="_blank" rel="noopener noreferrer">@themerievents</a>. <a href="/privacy/">Privacy</a>.</p>
        <p class="error" id="form-error" role="alert" hidden>Something went wrong. Please try again.</p>
      </form>
    </section>

    <section class="success" id="waitlist-success" hidden tabindex="-1">
      <p class="kicker">Welcome to the waitlist</p>
      <h2>You’re on<br>the list.</h2>
      <p>We’ll be in touch. Follow <a href="https://www.instagram.com/themerievents/" target="_blank" rel="noopener noreferrer">@themerievents</a>.</p>
    </section>
  </main>

  <script>
    (function () {
      var form = document.getElementById('waitlist-form');
      var formState = document.getElementById('form-state');
      var successState = document.getElementById('waitlist-success');
      var error = document.getElementById('form-error');
      if (!form || !formState || !successState || !error) return;

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        error.hidden = true;

        var submitButton = form.querySelector('button[type="submit"]');
        var label = submitButton.querySelector('span');
        submitButton.disabled = true;
        label.textContent = 'Adding you…';

        fetch('/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(new FormData(form)).toString()
        }).then(function (response) {
          if (!response.ok) throw new Error('Submission failed');
          formState.hidden = true;
          successState.hidden = false;
          successState.focus();
        }).catch(function () {
          error.hidden = false;
          submitButton.disabled = false;
          label.textContent = 'Request early access';
        });
      });
    })();
  </script>
</body>
</html>
